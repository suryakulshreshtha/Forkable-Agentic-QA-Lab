[project]
name = "forkable-agentic-qa-lab"
version = "0.1.0"
description = "AI-powered, Python + Playwright QA automation showcase — Web, API, Desktop, Power Platform & LLM-app testing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Surya Kulshreshtha" }]

dependencies = [
    "pytest>=8.0",
    "playwright>=1.47",
    "httpx>=0.27",
    "pytest-base-url>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 3 — LLM-application evaluation
llm-eval = [
    "deepeval>=1.0",
    "ragas>=0.2",
]
# Phase 4 — Windows desktop automation (Windows-only)
desktop = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
# Supply-chain / dependency governance
governance = [
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.5",
]
dev = [
    "ruff>=0.6",
    "allure-pytest>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "web_api: Web UI and API tests",
    "llm_app: LLM-application tests",
    "windows_desktop: Windows desktop UI Automation tests",
    "power_platform: Power Apps / Power Automate tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
